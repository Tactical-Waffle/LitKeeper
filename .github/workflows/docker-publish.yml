name: Docker

# Builds the litkeeparr image and publishes it to GitHub's container registry:
#   ghcr.io/tactical-waffle/litkeeparr:latest
# It runs on every push to the litkeeparr branch, and can be started by hand from the Actions tab.
# The tests run first; the image is built and published only when they all pass.

on:
  push:
    branches: [litkeeparr]
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Registry names must be lowercase.
  IMAGE_NAME: tactical-waffle/litkeeparr

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python (the image uses 3.13)
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the tests
        run: python -m pytest -q -p no:cacheprovider

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # The version number (e.g. 1.0.0) when a release is published
            type=semver,pattern={{version}}
            # 'latest' for every build of the litkeeparr branch, and for releases
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/litkeeparr' || github.event_name == 'release' }}
            # The short commit id, so you can go back to an older build
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
