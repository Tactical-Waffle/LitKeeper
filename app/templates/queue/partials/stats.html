{# One line of counts. #}
<span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-blue-500"></span><strong class="text-gray-900 dark:text-white">{{ pending }}</strong> queued</span>
<span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-amber-500 {% if processing > 0 %}animate-pulse{% endif %}"></span><strong class="text-gray-900 dark:text-white">{{ processing }}</strong> active</span>
<span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-green-500"></span><strong class="text-gray-900 dark:text-white">{{ completed }}</strong> done</span>
<span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-red-500"></span><strong class="text-gray-900 dark:text-white">{{ failed }}</strong> failed</span>
{% if rate_limited %}<span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-orange-500"></span><strong class="text-gray-900 dark:text-white">{{ rate_limited }}</strong> paused until tomorrow</span>{% endif %}
